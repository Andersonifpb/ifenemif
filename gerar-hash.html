<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Gerar hash do administrador</title>
<body style="font-family:system-ui;max-width:560px;margin:40px auto;padding:0 16px;background:#0e1814;color:#e6eee8">
<h1>Gerar hash da senha do administrador</h1>
<p>Digite a senha. Ela é processada só neste navegador: não é enviada nem guardada.</p>
<input id="s" type="password" autocomplete="new-password" style="width:100%;padding:10px;font-size:1rem">
<button onclick="gerar()" style="margin:10px 0;padding:10px 18px">Gerar</button>
<p>Copie o resultado e cole em <code>hash</code>, no arquivo <code>js/config-admin.js</code>:</p>
<textarea id="o" readonly rows="3" style="width:100%"></textarea>
<script src="js/config-admin.js"></script>
<script>async function gerar(){const s=document.getElementById("s").value;if(s.length<8){alert("Use ao menos 8 caracteres.");return}document.getElementById("o").value=await hashAdmin(s)}</script>
